name: Validate Astro and Next.js apps
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  astro-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
  next-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/learn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
